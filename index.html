<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IM PRETTY</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: pink;
        overflow: hidden;
        height: 100vh;
        margin: 0;
    }

    h1 {
        margin-top: 100px;
        font-size: 50px;
        color: white;
    }

    .btn {
        padding: 15px 35px;
        font-size: 24px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        position: absolute;
    }

    #yesBtn {
        background: limegreen;
        color: white;
        left: 55%;
        top: 50%;
    }

    #noBtn {
        background: red;
        color: white;
        left: 40%;
        top: 50%;
    }

    #message {
        margin-top: 250px;
        font-size: 40px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>IM PRETTY 💖</h1>

<button id="yesBtn" class="btn">YES</button>
<button id="noBtn" class="btn">NO</button>

<div id="message"></div>

<script>
const yesBtn = document.getElementById("yesBtn");

function moveButton() {
    const maxX = window.innerWidth - yesBtn.offsetWidth;
    const maxY = window.innerHeight - yesBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    yesBtn.style.left = randomX + "px";
    yesBtn.style.top = randomY + "px";
}

// Desktop mouse
yesBtn.addEventListener("mouseover", moveButton);

// Mobile touch
yesBtn.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveButton();
});

document.getElementById("noBtn").addEventListener("click", function() {
    document.getElementById("message").innerHTML =
       <br><br><br>  "HAHA 🤪🤣😜";
});
</script>

</body>
</html>
