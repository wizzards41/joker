<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💕</title>
<style>
    :root {
        --bg-top: #ffe3ec;
        --bg-bottom: #ffb8d2;
        --ink: #7a2748;
        --shadow: rgba(214, 51, 132, 0.25);
        --yes: #ff7aa2;
        --yes-dark: #ff4f80;
        --card: rgba(255, 255, 255, 0.75);
    }
    * { box-sizing: border-box; }
    html, body {
        height: 100%;
        margin: 0;
    }
    body {
        font-family: 'Georgia', 'Segoe UI', serif;
        text-align: center;
        background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
    }

    /* floating hearts background */
    .heart {
        position: absolute;
        bottom: -10%;
        color: rgba(255, 255, 255, 0.7);
        font-size: 24px;
        user-select: none;
        pointer-events: none;
        animation: float linear infinite;
        text-shadow: 0 2px 6px rgba(214, 51, 132, 0.2);
        z-index: 1;
    }
    @keyframes float {
        0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-115vh) translateX(var(--drift, 20px)) rotate(360deg); opacity: 0; }
    }

    .stage {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 70px 20px 60px;
    }

    h1 {
        margin: 0 0 6px;
        font-size: clamp(30px, 7vw, 48px);
        color: var(--ink);
        text-shadow: 0 3px 10px var(--shadow);
        letter-spacing: 0.5px;
    }
    .sub {
        color: var(--ink);
        opacity: 0.75;
        font-size: 17px;
        margin-bottom: 30px;
        font-style: italic;
    }

    .card {
        background: var(--card);
        backdrop-filter: blur(4px);
        border-radius: 22px;
        padding: 26px 30px;
        max-width: 420px;
        box-shadow: 0 10px 30px var(--shadow);
        margin-bottom: 34px;
    }
    .card p {
        color: var(--ink);
        font-size: 19px;
        line-height: 1.6;
        margin: 0;
    }

    #reasonBox {
        font-size: 18px;
        color: var(--ink);
        font-style: italic;
        min-height: 30px;
        margin-bottom: 18px;
        max-width: 380px;
        transition: opacity 0.3s ease;
    }

    .btn {
        padding: 15px 40px;
        font-size: 20px;
        font-weight: 700;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        background: linear-gradient(135deg, var(--yes), var(--yes-dark));
        color: white;
        box-shadow: 0 8px 20px rgba(255, 79, 128, 0.4);
        transition: transform 0.15s ease;
        letter-spacing: 0.5px;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.96); }

    #message {
        margin-top: 22px;
        font-size: 24px;
        font-weight: 700;
        color: var(--ink);
        text-shadow: 0 2px 8px var(--shadow);
        min-height: 40px;
        max-width: 420px;
    }
</style>
</head>
<body>

<div id="hearts"></div>

<div class="stage">
    <h1>For You 💕</h1>
    <div class="sub">a little something, just because</div>

    <div class="card">
        <p>Every day with you feels like the good part of a favorite song &mdash;
        the part you replay. You make ordinary moments feel worth remembering,
        and I don't say enough how lucky I feel to have you.</p>
    </div>

    <div id="reasonBox">Tap the button and find out why 👇</div>
    <button id="reasonBtn" class="btn">Tell me why you love me</button>
    <div id="message"></div>
</div>

<script>
// ---- floating hearts background ----
const heartsContainer = document.getElementById("hearts");
const heartChars = ["💖", "💕", "💗", "💓", "💞", "❤️", "🌸"];
function spawnHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
    const startX = Math.random() * 100;
    const drift = (Math.random() * 120 - 60) + "px";
    const size = 16 + Math.random() * 26;
    const duration = 8 + Math.random() * 8;
    heart.style.left = startX + "vw";
    heart.style.fontSize = size + "px";
    heart.style.setProperty("--drift", drift);
    heart.style.animationDuration = duration + "s";
    heartsContainer.appendChild(heart);
    setTimeout(() => heart.remove(), duration * 1000);
}
setInterval(spawnHeart, 400);
for (let i = 0; i < 12; i++) setTimeout(spawnHeart, i * 250);

// ---- sweet reasons ----
const reasons = [
    "because your laugh is my favorite sound",
    "because you make hard days feel lighter",
    "because you remember the little things I mention",
    "because you're the last thing I want to text before bed",
    "because you're kind, even when no one's watching",
    "because being around you feels like home",
    "because you believe in me on the days I don't",
    "because your smile is unfairly cute",
    "just because it's you"
];

const reasonBtn = document.getElementById("reasonBtn");
const reasonBox = document.getElementById("reasonBox");
const messageEl = document.getElementById("message");
let shown = [];

reasonBtn.addEventListener("click", function () {
    if (shown.length === reasons.length) shown = [];
    let pick;
    do {
        pick = reasons[Math.floor(Math.random() * reasons.length)];
    } while (shown.includes(pick));
    shown.push(pick);

    reasonBox.style.opacity = 0;
    setTimeout(() => {
        reasonBox.textContent = pick;
        reasonBox.style.opacity = 1;
    }, 200);

    if (shown.length === reasons.length) {
        messageEl.textContent = "...and about a thousand more reasons. I love you. 💕";
    }
});
</script>
</body>
</html>
